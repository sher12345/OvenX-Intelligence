<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#c0392b">
<title>Track Your Order — OvenX</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --red: #c0392b;
    --dark-red: #922b21;
    --orange: #e67e22;
    --green: #25D366;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
    font-family: 'Outfit', sans-serif;
    background: #0d0000;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── MAP ── */
#customer-map {
    flex: 1;
    min-height: 0;
    position: relative;
}

/* Map tiles dark */
.leaflet-container { background: #1a0a00 !important; }

/* ── BOTTOM SHEET ── */
#bottom-sheet {
    background: #0d0000;
    border-radius: 28px 28px 0 0;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 0 20px 40px;
    flex-shrink: 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
}

.sheet-handle {
    width: 40px; height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    margin: 14px auto 20px;
}

.rider-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
}

.rider-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(192,57,43,0.4);
}

.rider-info { flex: 1; }
.rider-name {
    font-size: 16px; font-weight: 900; color: white;
    margin-bottom: 3px;
}
.rider-status {
    font-size: 12px; color: rgba(255,255,255,0.4);
    display: flex; align-items: center; gap: 6px;
}
.live-dot {
    width: 8px; height: 8px;
    border-radius: 50%; background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    animation: pulse-live 1.5s infinite;
    flex-shrink: 0;
}
.live-dot.inactive { background: #666; box-shadow: none; animation: none; }
@keyframes pulse-live {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.4); }
}

.call-btn {
    background: rgba(37,211,102,0.15);
    border: 1px solid rgba(37,211,102,0.3);
    color: var(--green);
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    text-decoration: none;
    transition: all 0.2s;
}
.call-btn:active { background: rgba(37,211,102,0.3); transform: scale(0.95); }

/* ETA */
.eta-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
}
.eta-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
}
.eta-val {
    font-size: 26px; font-weight: 900;
    color: var(--orange);
    font-variant-numeric: tabular-nums;
}
.eta-lbl {
    font-size: 10px; font-weight: 600;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase; letter-spacing: 1.5px;
    margin-top: 3px;
}

/* Progress Steps */
.steps {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
    padding: 16px 18px;
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
}
.step {
    flex: 1;
    text-align: center;
    position: relative;
}
.step::after {
    content: '';
    position: absolute;
    top: 14px; right: -50%;
    width: 100%; height: 2px;
    background: rgba(255,255,255,0.1);
    z-index: 0;
}
.step:last-child::after { display: none; }
.step-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    position: relative; z-index: 1;
    transition: all 0.4s;
}
.step-dot.done {
    background: var(--red);
    border-color: var(--red);
    box-shadow: 0 0 14px rgba(192,57,43,0.5);
}
.step-dot.active {
    background: var(--orange);
    border-color: var(--orange);
    box-shadow: 0 0 14px rgba(230,126,34,0.6);
    animation: step-bounce 1.5s infinite;
}
@keyframes step-bounce {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}
.step-lbl {
    font-size: 9px; font-weight: 700;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase; letter-spacing: 1px;
    transition: color 0.4s;
}
.step.done .step-lbl { color: rgba(255,255,255,0.6); }
.step.active .step-lbl { color: var(--orange); }

/* Last updated */
.last-update {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    font-weight: 500;
}

/* ── WAITING STATE ── */
#waiting-state {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top, #2d0a0a 0%, #0d0000 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 30px;
    text-align: center;
    z-index: 100;
}
#waiting-state.hidden { display: none; }

.waiting-spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(192,57,43,0.2);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.waiting-title { font-size: 22px; font-weight: 900; }
.waiting-sub { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.7; max-width: 280px; }

/* ── DELIVERED STATE ── */
#delivered-banner {
    display: none;
    background: linear-gradient(135deg, rgba(37,211,102,0.15), rgba(37,211,102,0.05));
    border: 1px solid rgba(37,211,102,0.3);
    border-radius: 16px;
    padding: 16px 18px;
    text-align: center;
    margin-bottom: 14px;
}
#delivered-banner.show { display: block; }
.delivered-title { font-size: 18px; font-weight: 900; color: var(--green); margin-bottom: 4px; }
.delivered-sub { font-size: 13px; color: rgba(255,255,255,0.5); }

/* Map markers */
.restaurant-pin {
    background: var(--red);
    width: 32px; height: 32px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 3px solid white;
    box-shadow: 0 4px 15px rgba(192,57,43,0.6);
    display: flex; align-items: center; justify-content: center;
}
.restaurant-pin span { transform: rotate(45deg); font-size: 14px; }

.customer-pin-div {
    background: var(--orange);
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 4px 15px rgba(230,126,34,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
}

.moving-rider-pin {
    background: white;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 3px solid var(--red);
    box-shadow: 0 0 20px rgba(192,57,43,0.8), 0 0 0 6px rgba(192,57,43,0.2);
    animation: rider-pulse 1.5s infinite;
}
@keyframes rider-pulse {
    0%,100% { box-shadow: 0 0 15px rgba(192,57,43,0.6), 0 0 0 4px rgba(192,57,43,0.15); }
    50% { box-shadow: 0 0 25px rgba(192,57,43,1), 0 0 0 10px rgba(192,57,43,0.1); }
}

/* OvenX header overlay on map */
.map-header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 500;
    padding: 14px 16px;
    background: linear-gradient(to bottom, rgba(13,0,0,0.8) 0%, transparent 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
}
.map-logo {
    font-size: 18px; font-weight: 900;
    letter-spacing: -0.5px;
}
.map-logo span { color: var(--orange); }
.map-order-badge {
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px; font-weight: 700;
    color: rgba(255,255,255,0.7);
    pointer-events: all;
}
</style>
</head>
<body>

<!-- MAP -->
<div id="customer-map">
    <div class="map-header">
        <div class="map-logo">OVEN <span>X</span></div>
        <div class="map-order-badge" id="map-order-badge">Loading...</div>
    </div>

    <!-- WAITING FOR RIDER -->
    <div id="waiting-state">
        <div class="waiting-spinner"></div>
        <div class="waiting-title">Finding Your Rider</div>
        <div class="waiting-sub" id="waiting-msg">
            Waiting for your rider to start tracking...<br>
            This page will update automatically.
        </div>
        <div style="font-size:12px; color:rgba(255,255,255,0.2); margin-top:10px;" id="waiting-order-info"></div>
    </div>
</div>

<!-- BOTTOM SHEET -->
<div id="bottom-sheet">
    <div class="sheet-handle"></div>

    <!-- Delivered banner -->
    <div id="delivered-banner">
        <div class="delivered-title">🎉 Order Delivered!</div>
        <div class="delivered-sub">Your food has arrived. Enjoy your meal!</div>
    </div>

    <!-- Rider card -->
    <div class="rider-card" id="rider-card" style="display:none;">
        <div class="rider-avatar">🏍️</div>
        <div class="rider-info">
            <div class="rider-name" id="rider-name-display">—</div>
            <div class="rider-status">
                <div class="live-dot" id="live-dot"></div>
                <span id="rider-status-text">Connecting...</span>
            </div>
        </div>
        <a class="call-btn" id="call-rider-btn" href="#" title="Call Rider">📞</a>
    </div>

    <!-- ETA -->
    <div class="eta-row" id="eta-row" style="display:none;">
        <div class="eta-box">
            <div class="eta-val" id="eta-distance">—</div>
            <div class="eta-lbl">Km Away</div>
        </div>
        <div class="eta-box">
            <div class="eta-val" id="eta-time">—</div>
            <div class="eta-lbl">Min ETA</div>
        </div>
    </div>

    <!-- Progress Steps -->
    <div class="steps" id="steps-row" style="display:none;">
        <div class="step done" id="step-placed">
            <div class="step-dot done">✓</div>
            <div class="step-lbl">Placed</div>
        </div>
        <div class="step done" id="step-preparing">
            <div class="step-dot done">✓</div>
            <div class="step-lbl">Preparing</div>
        </div>
        <div class="step active" id="step-onway">
            <div class="step-dot active">🏍</div>
            <div class="step-lbl">On Way</div>
        </div>
        <div class="step" id="step-delivered">
            <div class="step-dot">🎉</div>
            <div class="step-lbl">Delivered</div>
        </div>
    </div>

    <div class="last-update" id="last-update">Connecting to live tracking...</div>
</div>

<script>
const SUPABASE_URL = "https://frjcefugnvitexxcated.supabase.co";
const SUPABASE_KEY = "sb_publishable_iymHBHXzWCXmXI4yUfQ_XQ__5EW47HJ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Branch restaurant coords
const BRANCH_COORDS = {
    MULTAN: { lat: 30.2197, lng: 71.4711, name: 'OvenX Multan' },
    BWP:    { lat: 29.38365, lng: 71.67091, name: 'OvenX Bahawalpur' }
};

// Rider phone map (update these)
const RIDER_PHONES = {
    MULTAN: {
        "Ramzan":     "923196206229",
        "Abdurehman": "923286001660",
        "Atif":       "923047373321",
        "Ehsan":      "923193157142"
    },
    BWP: {
        "Raffay":  "923440398730",
        "Waseem":  "923123382820",
        "Asif":    "923008683615",
        "Touqeer": "923706547442",
        "Talha":   "923008643811",
        "Danish":  "923126299048"
    }
};

// Parse URL
const params = new URLSearchParams(window.location.search);
const orderId = params.get('order') || '';
const branch  = (params.get('branch') || 'MULTAN').toUpperCase();

const branchCoords = BRANCH_COORDS[branch] || BRANCH_COORDS.MULTAN;

let map, riderMarker, restaurantMarker;
let trackChannel = null;
let mapInitialized = false;
let lastRiderLat = null, lastRiderLng = null;
let isDelivered = false;
let refreshInterval = null;

// Init UI
document.getElementById('map-order-badge').textContent = orderId ? '#' + orderId.slice(0,8).toUpperCase() : 'Live Tracking';
document.getElementById('waiting-order-info').textContent = orderId ? 'Order #' + orderId.slice(0,8).toUpperCase() + ' · ' + branch : '';

// ── INIT MAP (background, show only when rider found) ──
function initMap(riderLat, riderLng) {
    if (mapInitialized) return;
    mapInitialized = true;

    map = L.map('customer-map', {
        center: [riderLat, riderLng],
        zoom: 14,
        zoomControl: false,
        attributionControl: false
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd'
    }).addTo(map);

    // Restaurant marker
    const restIcon = L.divIcon({
        className: '',
        html: `<div class="restaurant-pin"><span>🍕</span></div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 32]
    });
    restaurantMarker = L.marker([branchCoords.lat, branchCoords.lng], { icon: restIcon }).addTo(map);
    restaurantMarker.bindTooltip(branchCoords.name, { permanent: false, direction: 'top' });

    // Rider marker
    const riderIcon = L.divIcon({
        className: '',
        html: `<div class="moving-rider-pin"></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
    });
    riderMarker = L.marker([riderLat, riderLng], { icon: riderIcon }).addTo(map);
    riderMarker.bindTooltip('Your Rider', { permanent: false, direction: 'top' });

    // Fit bounds to show both
    const bounds = L.latLngBounds(
        [branchCoords.lat, branchCoords.lng],
        [riderLat, riderLng]
    );
    map.fitBounds(bounds, { padding: [60, 60] });
}

// ── UPDATE RIDER POSITION ──
function updateRiderPosition(lat, lng, riderName, isActive) {
    lastRiderLat = lat;
    lastRiderLng = lng;

    // Show map, hide waiting
    document.getElementById('waiting-state').classList.add('hidden');
    document.getElementById('rider-card').style.display = 'flex';
    document.getElementById('eta-row').style.display = 'grid';
    document.getElementById('steps-row').style.display = 'flex';

    // Init map if first time
    if (!mapInitialized) initMap(lat, lng);

    // Move rider marker smoothly
    if (riderMarker) {
        animateMarker(riderMarker, [lat, lng]);
    }

    // Fit map
    if (map && isActive) {
        const bounds = L.latLngBounds(
            [branchCoords.lat, branchCoords.lng],
            [lat, lng]
        );
        map.fitBounds(bounds, { padding: [80, 80], maxZoom: 16, animate: true });
    }

    // Update rider card
    document.getElementById('rider-name-display').textContent = riderName || 'Your Rider';

    // Rider phone
    const phones = RIDER_PHONES[branch] || {};
    const phone = phones[riderName];
    const callBtn = document.getElementById('call-rider-btn');
    if (phone) {
        callBtn.href = 'tel:+' + phone;
        callBtn.style.opacity = '1';
    } else {
        callBtn.href = '#';
        callBtn.style.opacity = '0.3';
    }

    // Live dot
    const dot = document.getElementById('live-dot');
    if (isActive) {
        dot.className = 'live-dot';
        document.getElementById('rider-status-text').textContent = 'Live — on the way to you';
    } else {
        dot.className = 'live-dot inactive';
        document.getElementById('rider-status-text').textContent = 'Tracking paused';
    }

    // ETA calculation (straight line distance)
    // We'd need customer's coords for real ETA — using restaurant for now
    const dist = haversineKm(lat, lng, branchCoords.lat, branchCoords.lng);
    const distFromRest = dist.toFixed(1);

    // Rough ETA: assume 30 km/h avg speed in city
    const etaMins = Math.ceil((dist / 30) * 60);

    document.getElementById('eta-distance').textContent = distFromRest;
    document.getElementById('eta-time').textContent = isActive ? etaMins : '—';

    // Last update
    document.getElementById('last-update').textContent =
        '📍 Last update: ' + new Date().toLocaleTimeString('en-PK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    // Delivered state
    if (!isActive && !isDelivered) {
        isDelivered = true;
        showDelivered();
    }
}

// ── DELIVERED ──
function showDelivered() {
    document.getElementById('delivered-banner').classList.add('show');

    // Update steps
    const stepOnway = document.getElementById('step-onway');
    const stepDelivered = document.getElementById('step-delivered');
    stepOnway.querySelector('.step-dot').className = 'step-dot done';
    stepOnway.querySelector('.step-dot').textContent = '✓';
    stepOnway.className = 'step done';
    stepDelivered.querySelector('.step-dot').className = 'step-dot done';
    stepDelivered.querySelector('.step-dot').textContent = '✓';
    stepDelivered.className = 'step done';

    document.getElementById('rider-status-text').textContent = '✅ Order delivered!';
    document.getElementById('live-dot').className = 'live-dot';
    document.getElementById('live-dot').style.background = '#4ade80';

    document.getElementById('eta-distance').textContent = '0';
    document.getElementById('eta-time').textContent = '🎉';
}

// ── SMOOTH MARKER ANIMATION ──
function animateMarker(marker, newLatLng) {
    const startLatLng = marker.getLatLng();
    const frames = 20;
    let frame = 0;

    const animate = () => {
        frame++;
        const t = frame / frames;
        const lat = startLatLng.lat + (newLatLng[0] - startLatLng.lat) * t;
        const lng = startLatLng.lng + (newLatLng[1] - startLatLng.lng) * t;
        marker.setLatLng([lat, lng]);
        if (frame < frames) requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
}

// ── HAVERSINE ──
function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── FETCH LATEST LOCATION ──
async function fetchLatestLocation() {
    if (!orderId) return;

    const { data, error } = await sb.from('rider_locations')
        .select('*')
        .eq('order_id', orderId)
        .single();

    if (data) {
        updateRiderPosition(data.lat, data.lng, data.rider_name, data.is_active);
    }
}

// ── REALTIME SUBSCRIPTION ──
function subscribeToRider() {
    if (!orderId) {
        document.getElementById('waiting-msg').textContent = 'No order ID found. Please use the link sent to you.';
        return;
    }

    // Initial fetch
    fetchLatestLocation();

    // Poll every 5 seconds as fallback
    refreshInterval = setInterval(fetchLatestLocation, 5000);

    // Realtime subscription
    trackChannel = sb.channel('rider-track-' + orderId)
        .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'rider_locations',
            filter: `order_id=eq.${orderId}`
        }, (payload) => {
            if (payload.new) {
                updateRiderPosition(
                    payload.new.lat,
                    payload.new.lng,
                    payload.new.rider_name,
                    payload.new.is_active
                );
            }
        })
        .subscribe();
}

// Start
subscribeToRider();
</script>
</body>
</html>
