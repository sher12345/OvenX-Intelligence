<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OvenX — Caller Lookup</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#c0392b; --dark-red:#922b21; --orange:#e67e22; --bg:#f8f5f2;
    --card:#ffffff; --ink:#1a1a1a; --muted:#8a8a8a; --line:#eee0d8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',sans-serif;padding:20px;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:22px;font-weight:900;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#2e7d32;margin-bottom:18px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#2e7d32;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .search-row{display:flex;gap:10px;margin-bottom:20px;}
  input#phoneInput{
    flex:1;padding:16px;font-size:17px;border-radius:14px;border:2px solid var(--line);
    font-family:'Outfit',sans-serif;font-weight:600;
  }
  input#phoneInput:focus{outline:none;border-color:var(--orange);}
  button#searchBtn{
    padding:16px 22px;border:none;border-radius:14px;background:var(--red);color:#fff;
    font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 var(--dark-red);
  }
  button#searchBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dark-red);}
  .card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 2px 16px rgba(0,0,0,0.07);display:none;}
  .card.show{display:block;}
  .cust-name{font-size:20px;font-weight:900;margin:0 0 2px;}
  .cust-phone{color:var(--muted);font-size:13px;margin-bottom:14px;}
  .badge-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .badge{background:#fdf0e6;color:var(--dark-red);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:800;margin:16px 0 8px;}
  .addr{
    background:#faf7f4;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .addr-text{font-size:14px;font-weight:600;line-height:1.4;}
  .addr-meta{font-size:11px;color:var(--muted);margin-top:3px;}
  .copy-btn{
    border:none;background:var(--orange);color:#fff;padding:8px 12px;border-radius:10px;
    font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .big{font-size:40px;margin-bottom:10px;}
  .new-cust{
    background:#fff8e1;border:1px solid #ffe082;border-radius:16px;padding:18px;text-align:center;
    font-weight:700;color:#8a6d00;
  }
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;
    padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📞 OvenX Caller Lookup</h1>
  <div class="sub">Enter or auto-fill the caller's number to pull their order history</div>
  <div class="status"><span class="dot"></span> Listening for incoming calls</div>

  <div class="search-row">
    <input id="phoneInput" type="tel" placeholder="03XX-XXXXXXX" autofocus>
    <button id="searchBtn">Look Up</button>
  </div>

  <div class="card" id="resultCard"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://frjcefugnvitexxcated.supabase.co";
const SUPABASE_KEY = "sb_publishable_iymHBHXzWCXmXI4yUfQ_XQ__5EW47HJ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const phoneInput = document.getElementById('phoneInput');
const resultCard = document.getElementById('resultCard');
const toast = document.getElementById('toast');

function normalizePhone(raw){
  let p = raw.replace(/[\s\-\(\)]/g, '');
  if (p.startsWith('0')) p = '92' + p.slice(1);
  if (!p.startsWith('92')) p = '92' + p;
  return p;
}
function displayPhone(p){
  // 923001450301 -> 0300-1450301
  const local = '0' + p.slice(2);
  return local.slice(0,4) + '-' + local.slice(4);
}
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1600);
}
function timeAgo(iso){
  if(!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30) return days + ' days ago';
  return Math.floor(days/30) + ' months ago';
}

async function lookup(rawPhone){
  const phone = normalizePhone(rawPhone);
  const { data, error } = await sb.from('customers').select('*').eq('phone', phone);
  const customer = data && data[0];

  resultCard.classList.add('show');

  if (!customer) {
    resultCard.innerHTML = `
      <div class="empty">
        <div class="big">🆕</div>
        <div><b>New Customer</b></div>
        <div style="font-size:13px;margin-top:4px;">${displayPhone(phone)} — no order history yet.<br>Ask for their name & address as usual.</div>
      </div>`;
    return;
  }

  const addrHtml = (customer.addresses || []).map(a => `
    <div class="addr">
      <div>
        <div class="addr-text">📍 ${a.address}</div>
        <div class="addr-meta">Used ${a.count}x · last ${timeAgo(a.last_used)}</div>
      </div>
      <button class="copy-btn" onclick="copyAddr(this)" data-addr="${a.address.replace(/"/g,'&quot;')}">Copy</button>
    </div>
  `).join('') || '<div class="addr-meta">No saved addresses yet.</div>';

  resultCard.innerHTML = `
    <div class="cust-name">👤 ${customer.name || 'Name not on file'}</div>
    <div class="cust-phone">${displayPhone(customer.phone)}</div>
    <div class="badge-row">
      <div class="badge">🧾 ${customer.total_orders || 0} orders</div>
      <div class="badge">🕒 Last order ${timeAgo(customer.last_order_at)}</div>
      ${customer.last_branch ? `<div class="badge">🏪 ${customer.last_branch}</div>` : ''}
    </div>
    <div class="section-title">Saved Addresses</div>
    ${addrHtml}
  `;
}

function copyAddr(btn){
  const text = btn.getAttribute('data-addr');
  navigator.clipboard.writeText(text).then(()=> showToast('Address copied ✓'));
}

document.getElementById('searchBtn').addEventListener('click', () => {
  if (phoneInput.value.trim()) lookup(phoneInput.value.trim());
});
phoneInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && phoneInput.value.trim()) lookup(phoneInput.value.trim());
});

// ── Realtime: auto-popup the moment a call comes in ──
// Fed by the Android automation step (MacroDroid/Tasker) posting
// to the `incoming_calls` table when the phone rings.
sb.channel('incoming-calls-listen')
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'incoming_calls' }, (payload) => {
    const num = payload.new.phone;
    phoneInput.value = displayPhone(normalizePhone(num));
    lookup(num);
    showToast('📞 Incoming call — looked up automatically');
  })
  .subscribe();
</script>
</body>
</html>
