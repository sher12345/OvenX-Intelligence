<style>

.st{width:100%;height:34px;border-radius:12px;margin-top:10px;font-weight:700;background:rgba(61,220,132,.15);color:var(--acc)}.st.ok{background:rgba(52,224,161,.14);color:var(--mint)}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,150%);background:#23242c;border:1px solid var(--line);padding:10px 18px;border-radius:20px;font-weight:700;z-index:200;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}.toast.show{transform:translate(-50%,0)}
.bento>.c::before{content:'';position:absolute;left:20px;right:20px;top:0;height:3px;border-radius:0 0 4px 4px;background:var(--a,transparent);opacity:.9}
#hero>.c:nth-child(1){--a:linear-gradient(90deg,#3ddc84,#9ff5c4)}#hero>.c:nth-child(2){--a:linear-gradient(90deg,#ffc857,#ff5fa2)}#hero>.c:nth-child(3){--a:linear-gradient(90deg,#5db4f5,#a78bfa)}
.bento:not(#hero)>.c:nth-child(1){--a:linear-gradient(90deg,#a78bfa,#ff5fa2)}.bento:not(#hero)>.c:nth-child(2){--a:linear-gradient(90deg,#5db4f5,#3ddc84)}.bento:not(#hero)>.c:nth-child(3){--a:linear-gradient(90deg,#ffc857,#3ddc84)}.bento:not(#hero)>.c:nth-child(4){--a:linear-gradient(90deg,#ff5fa2,#ffc857)}
.lr:nth-child(1) .tr i{background:linear-gradient(90deg,#ffc857,#ff9ec4)}.lr:nth-child(2) .tr i{background:linear-gradient(90deg,#3ddc84,#9ff5c4)}.lr:nth-child(3) .tr i{background:linear-gradient(90deg,#a78bfa,#d4c4ff)}.lr:nth-child(4) .tr i{background:linear-gradient(90deg,#ff5fa2,#ffb0d0)}.lr:nth-child(5) .tr i{background:linear-gradient(90deg,#5db4f5,#b5dcff)}.lr:nth-child(6) .tr i{background:linear-gradient(90deg,#2dd4bf,#99f6e4)}.lr:nth-child(7) .tr i{background:linear-gradient(90deg,#ffc857,#fde7a8)}.lr:nth-child(8) .tr i{background:linear-gradient(90deg,#a78bfa,#5db4f5)}
.tag:nth-of-type(4n+1){background:rgba(61,220,132,.16)}.tag:nth-of-type(4n+2){background:rgba(93,180,245,.16)}.tag:nth-of-type(4n+3){background:rgba(167,139,250,.18)}.tag:nth-of-type(4n){background:rgba(255,95,162,.16)}
.btn:hover{border-color:rgba(167,139,250,.5)}th:nth-child(4n+1){color:#9ff5c4}th:nth-child(4n+2){color:#b5dcff}th:nth-child(4n+3){color:#d4c4ff}th:nth-child(4n){color:#ffb0d0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="gate"><div class="c"><div class="logo">OVEN <span>X</span> Fleet</div><p>Admin access only. Enter your PIN.</p>
<input class="inp" id="pin" type="password" inputmode="numeric" placeholder="Admin PIN" aria-label="Admin PIN"><button class="cta" onclick="unlock()">Open dashboard</button><div id="err"></div></div></div>

<div id="app">
 <div class="top">
  <h1 class="logo">OVEN <span>X</span> Fleet<small><i class="pulse"></i><span id="upd">Loading…</span></small></h1>
  <div class="seg" id="per"><i class="pill"></i><button data-p="today" class="on">Today</button><button data-p="week">7 days</button><button data-p="month">Month</button></div>
  <select class="inp" id="br" aria-label="Branch"><option value="">All branches</option><option value="MULTAN">Multan</option><option value="BWP">Bahawalpur</option></select>
  <input class="inp sr" id="q" placeholder="Search rider" aria-label="Search rider">
  <button class="btn rf" onclick="load(true)" aria-label="Refresh"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" stroke="rgba(255,255,255,.1)"/><circle id="cd" cx="18" cy="18" r="16" stroke="#3ddc84" stroke-dasharray="0 100.5" pathLength="100.5"/></svg>↻</button>
  <button class="btn" onclick="exportCsv()">CSV</button><button class="btn" onclick="lock()">Lock</button>
 </div>
 <div class="alerts" id="alerts"></div>
 <div class="bento" id="hero"></div>
 <div class="bento">
  <div class="c s7"><h2>Top riders <i>deliveries · fees · tap for details</i></h2><div class="lb" id="lb"></div></div>

 </div>
 <div class="c"><h2>All riders <i>tap a row for full details</i></h2><div class="tw"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div></div>
</div>
<div id="dr-bd" onclick="closeDr()"></div><aside id="dr" aria-label="Rider details"></aside><div class="toast" id="toast"></div>

<script>
const sb=supabase.createClient("https://frjcefugnvitexxcated.supabase.co","sb_publishable_iymHBHXzWCXmXI4yUfQ_XQ__5EW47HJ");
const ADMIN_PIN='9999'; // CHANGE THIS
const CASH_ALERT=20000, LATE_MIN=45, REFRESH=30;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'Rs '+Math.round(Number(n||0)).toLocaleString();
const tm=d=>d?new Date(d).toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit',hour12:true}):'—';
const dt=d=>d?new Date(d).toLocaleDateString('en-PK',{day:'numeric',month:'short'}):'—';
const NONCASH=['jazzcash','card','bank','credited'];
const PMN={cash:'Cash',jazzcash:'JazzCash/EasyPaisa',card:'Card',bank:'Bank',credited:'Credited'};
const PMC={cash:'#34e0a1',jazzcash:'#6cb8ff',card:'#a78bfa',bank:'#ffc857',credited:'#ff6b7a'};
const normPhone=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('92'))d=d.slice(2);if(d.startsWith('0'))d=d.slice(1);return d};
function bizDayStart(){const d=new Date();if(d.getHours()<6)d.setDate(d.getDate()-1);d.setHours(6,0,0,0);return d}
function range(p){const n=new Date();if(p==='today')return bizDayStart();if(p==='week'){n.setDate(n.getDate()-6);n.setHours(0,0,0,0);return n}n.setDate(1);n.setHours(0,0,0,0);return n}
function minsOf(o){const c=o.completed_at&&new Date(o.completed_at).getTime();const s=o.delivery_started_at?new Date(o.delivery_started_at).getTime():(o.created_at?new Date(o.created_at).getTime():null);return c&&s?Math.max(0,Math.round((c-s)/60000)):null}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
let period='today',branch='',query='',riders=[],active=[],hours=new Array(24).fill(0),pay={},sortKey='count',sortDir=-1,timer=null,tick=null,left=REFRESH,anim=true,prev={},openKey=null,fails=0;

/* gate */
function unlock(){if(fails>=5){$('err').textContent='Too many attempts. Reload the page.';return}
 if($('pin').value===ADMIN_PIN){try{sessionStorage.setItem('ovenx_admin','1')}catch(e){}start()}else{fails++;$('err').textContent='Wrong PIN';setTimeout(()=>$('err').textContent='',2500)}}
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function start(){$('gate').style.display='none';$('app').classList.add('on');movePill();load();timer=setInterval(()=>{left--;$('cd').setAttribute('stroke-dasharray',((REFRESH-left)/REFRESH*100.5)+' 100.5');if(left<=0)load()},1000);tick=setInterval(renderLive,30000)}
function lock(){try{sessionStorage.removeItem('ovenx_admin')}catch(e){}location.reload()}
try{if(sessionStorage.getItem('ovenx_admin')==='1')start()}catch(e){}
function movePill(){const b=$('per').querySelector('.on'),p=$('per').querySelector('.pill');p.style.left=b.offsetLeft+'px';p.style.width=b.offsetWidth+'px'}
$('per').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;period=b.dataset.p;[...$('per').querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b));movePill();load(true)});
$('br').addEventListener('change',e=>{branch=e.target.value;load(true)});
$('q').addEventListener('input',e=>{query=e.target.value.toLowerCase();renderTable()});

/* data */
async function load(a){
 left=REFRESH;if(a)anim=true;
 try{
  const s=range(period),iso=s.toISOString(),since=new Date(s.getTime()-2*864e5).toISOString();
  const [att,ord,act]=await Promise.all([
   sb.from('rider_attendance').select('*').gte('punched_in',since).order('punched_in',{ascending:false}).limit(3000),
   sb.from('kitchen_orders').select('*').or(`completed_at.gte.${iso},cancelled_at.gte.${iso}`).limit(5000),
   sb.from('kitchen_orders').select('*').in('status',['ASSIGNED','DELIVERING']).order('created_at',{ascending:true})]);
  if(att.error)throw att.error;if(ord.error)throw ord.error;
  build(att.data||[],ord.data||[],act.data||[],s);
  $('upd').textContent='Updated '+tm(new Date())+' · auto-refresh 30s';
 }catch(e){console.error(e);$('upd').textContent='Load failed: '+e.message}
}
function build(att,ord,act,s){
 const idKey={},R={};hours=new Array(24).fill(0);pay={};
 const get=(k,seed)=>R[k]||(R[k]={key:k,name:seed.name||'Rider',phone:seed.phone||'',branch:seed.branch||'',status:'off-duty',lastIn:null,lastOut:null,shifts:[],ms:0,orders:[],cancelled:[],active:[],count:0,fees:0,mins:0,valid:0,fast:0,ontime:0,late:0,cash:0,owed:0,cred:0,collected:0,settled:0,unsettled:0});
 att.forEach(a=>{const k=normPhone(a.phone)||('id'+a.id);idKey[String(a.id)]=k;const r=get(k,a);
  if(!r.lastIn||new Date(a.punched_in)>new Date(r.lastIn)){r.lastIn=a.punched_in;r.lastOut=a.punched_out;r.status=a.status;r.name=a.name||r.name;r.branch=a.branch||r.branch}
  const end=a.punched_out?new Date(a.punched_out):new Date();
  if(end>=s){r.shifts.push(a);r.ms+=Math.max(0,end-Math.max(new Date(a.punched_in),s))}});
 const keyOf=o=>idKey[String(o.assigned_rider)]||get('id'+o.assigned_rider,{name:'Rider '+String(o.assigned_rider).slice(-4)}).key;
 ord.forEach(o=>{if(!o.assigned_rider)return;const r=R[keyOf(o)];
  if(o.status==='COMPLETED'&&o.completed_at&&new Date(o.completed_at)>=s){
   const m=minsOf(o);o.mins=m;r.orders.push(o);r.count++;r.fees+=o.delivery_fee||0;
   if(m!=null){r.mins+=m;r.valid++;if(m<=20)r.fast++;if(m<=40)r.ontime++;else r.late++}
   const food=(o.subtotal||0)+(o.tax||0),fee=o.delivery_fee||0,pm=o.payment_method;
   if(!branch||r.branch===branch){hours[new Date(o.completed_at).getHours()]++;pay[pm||'cash']=(pay[pm||'cash']||0)+1}
   if(pm==='credited')r.cred+=food+fee;else r.collected+=food+fee;
   if(o.settled)r.settled++;else{r.unsettled++;if(NONCASH.includes(pm))r.owed+=fee;else r.cash+=food}
  }else if(o.status==='CANCELLED')r.cancelled.push(o)});
 act.forEach(o=>{if(!o.assigned_rider)return;R[keyOf(o)].active.push(o)});
 riders=Object.values(R).filter(r=>!branch||r.branch===branch).filter(r=>r.count||r.cancelled.length||r.active.length||r.ms>0);
 active=riders.flatMap(r=>r.active.map(o=>({o,r})));
 renderAlerts();renderHero();renderLb();renderLive();renderHours();renderPay();renderTable();
 anim=false;if(openKey)openDr(openKey,true);
}

/* helpers */
function cu(el,to,f){const id=el.dataset.id,from=anim?0:(prev[id]??to);prev[id]=to;if(from===to){el.textContent=f(to);return}
 const t0=performance.now(),d=900;(function st(t){const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e);if(p<1)requestAnimationFrame(st)})(t0)}
